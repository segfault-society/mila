[project]
name = "mila"
version = "0.1.0"
description = "Mila: short-horizon food price spike warnings for Sri Lankan eateries"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "holidays>=0.60",
    "httpx>=0.27",
    "lightgbm>=4.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "psycopg[binary]>=3.2",
    "resend>=2.53.1",
    "scikit-learn>=1.9.1",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
mila = "mila.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mila"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs DATABASE_URL pointing at a disposable Postgres",
    "rawpdf: needs CBSL PDFs under data/raw/pdf",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
